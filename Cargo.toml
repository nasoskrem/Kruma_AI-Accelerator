[package]
name = "Kruma_AI-Accelerator" 
version = "0.3.1"
edition = "2024"

[dependencies]
rayon = "1.12.0"
wide = "1.4.0"

[build-dependencies]
cc = "1.2.62"

[[bin]]
name = "main"
path = "src/main.rs"

[[bin]]
name = "matmul"
path = "experiments/matmul.rs"

[[bin]]
name = "xor"
path = "experiments/xor.rs"

[[bin]]
name = "classes"
path = "experiments/class_classification.rs"

[lib]
name = "kruma"
path = "src/lib.rs"